[project]
name = "astra-backend"
version = "1.0.0"
description = "ASTRA Spacecraft Telemetry & Anomaly Intelligence Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
astra-server = "backend.app.main:run_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
